<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1280px; height: 720px; overflow: hidden; background: #000; font-family: "Arial Black", "Segoe UI Black", Arial, sans-serif; }
  #photo { position: absolute; right: -110px; top: 0; width: 800px; height: 720px; object-fit: cover; object-position: 30% 30%; }
  #shade { position: absolute; inset: 0; background: linear-gradient(90deg, #000 0%, #000 46%, rgba(0, 0, 0, 0.88) 53%, rgba(0, 0, 0, 0) 76%); }
  #text { position: absolute; left: 56px; top: 0; width: 760px; height: 720px; display: flex; flex-direction: column; justify-content: center; }
  #top { color: #f4eedd; font-size: 52px; line-height: 1; letter-spacing: 1px; white-space: nowrap; }
  #big { color: #d23232; font-size: 196px; line-height: 0.95; margin-top: 14px; -webkit-text-stroke: 3px #000; text-shadow: 0 6px 0 #000; }
  #word { color: #f4eedd; font-size: 116px; line-height: 0.95; text-shadow: 0 4px 18px #000; }
  #tag { align-self: flex-start; margin-top: 30px; padding: 12px 26px 14px; background: #ffe14d; color: #000; font-size: 44px; line-height: 1; white-space: nowrap; }
</style>
</head>
<body>
  <img id="photo" src="assets/stock/elderly-man-reading-document-3.jpg" alt="">
  <div id="shade"></div>
  <div id="text">
    <div id="top">SOCIAL SECURITY 2027</div>
    <div id="big">4</div>
    <div id="word">CHANGES</div>
    <div id="tag">CHECK BEFORE JANUARY</div>
  </div>
</body>
</html>
